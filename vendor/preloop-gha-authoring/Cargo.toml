[package]
name = "preloop-gha-authoring"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Source-preserving GitHub Actions workflow authoring document"
repository = "https://github.com/preloopdev/loopt"
readme = "README.md"
keywords = ["github-actions", "workflow", "yaml", "authoring"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "1"
