[package]
name = "preloop-gha-parser"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Source-preserving GitHub Actions authoring document (vendored from Preloop)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "1"
