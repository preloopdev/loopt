[package]
name = "preloop-gha-sec"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native GitHub Actions security audits (vendored from Preloop)"
publish = false

[dependencies]
preloop-gha-expressions = { path = "../preloop-gha-expressions" }
preloop-gha-lint = { path = "../preloop-gha-lint" }
preloop-gha-parser = { path = "../preloop-gha-parser" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
