[package]
name = "preloop-gha-sec"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native GitHub Actions workflow security audits"
repository = "https://github.com/preloopdev/loopt"
readme = "README.md"
keywords = ["github-actions", "workflow", "security", "audit"]
categories = ["development-tools"]

[dependencies]
preloop-gha-expressions = { path = "../preloop-gha-expressions", version = "0.1.0" }
preloop-gha-lint = { path = "../preloop-gha-lint", version = "0.1.0" }
preloop-gha-authoring = { path = "../preloop-gha-authoring", version = "0.1.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
