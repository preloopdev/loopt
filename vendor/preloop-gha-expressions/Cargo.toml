[package]
name = "preloop-gha-expressions"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "GitHub Actions expression parser and evaluator (vendored from Preloop)"
publish = false

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
sha2 = "0.10"
glob = "0.3"
parking_lot = "0.12"
