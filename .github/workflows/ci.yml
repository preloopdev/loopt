# Generated by loopt. Edit the source under .loopt/workflows and run loopt gen.
name: ci
on:
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on:
    - self-hosted
    - preloop-cpane
    - preloop-ubuntu-24.04-4vcpu-16gb
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: '1.97'
        components: rustfmt,clippy
    - name: Format
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test
      run: "cargo test --locked --workspace --exclude preloop-gha-expressions --lib --tests"
    - name: Build
      run: cargo build --locked
    - name: Language toolchains
      run: node --version && python3 --version && go version
    - name: Loopt version
      run: ./target/debug/loopt --version
