[package]
name = "preloop-gha-schema"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Typed, order-preserving model of GitHub's workflow and action template schemas"
repository = "https://github.com/preloopdev/loopt"
publish = false

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
